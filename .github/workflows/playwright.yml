# Playwright E2E Tests
#
# Runs the full Playwright suite on every push to main (or manually from the
# Actions tab) and uploads the HTML report as a downloadable artifact.
# Tests target the live site configured in playwright.config.ts.

name: Playwright Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright tests
    # Pinned: ubuntu-latest is now 26.04, which Playwright 1.58 does not support.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npx playwright test --reporter=html,line
        env:
          CI: true

      # Runs even when tests fail, so the report is always available.
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
